<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪日记与自我关怀</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fdf6f0 0%, #f3ecf8 100%);
    color: #3d3a50;
  }
  .card {
    text-align: center;
    padding: 56px 48px;
    max-width: 560px;
    background: rgba(255,255,255,.82);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(90,80,140,.10);
    margin: 24px;
  }
  .dot { font-size: 52px; line-height: 1; }
  h1 { font-size: 28px; font-weight: 700; margin: 18px 0 10px; }
  p { font-size: 15px; line-height: 1.8; color: #6a6780; }
  .tag {
    display: inline-block; margin-top: 20px; padding: 6px 16px;
    border-radius: 999px; background: #efe9fb; color: #6b52b8;
    font-size: 13px; font-weight: 600;
  }
  .plan { margin-top: 22px; font-size: 13px; color: #9894ab; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">🌱</div>
    <h1>情绪日记与自我关怀</h1>
    <p>记录情绪 · 分析触发因素 · 推荐冥想 / 音乐 / 运动等自助调节方案</p>
    <span class="tag">项目已初始化，功能迭代中</span>
    <div class="plan">后续将在此链接持续更新：情绪打卡、趋势分析、智能调节建议</div>
  </div>
</body>
</html>
